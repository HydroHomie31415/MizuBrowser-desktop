name: Release Linux package

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: Version for a test build (for example 0.1.0)
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MIZU_BUILD_MODE: artifact
      MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE: system
    steps:
      - uses: actions/checkout@v4

      - name: Install release tools
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Bootstrap Firefox artifact build
        env:
          MOZBUILD_STATE_PATH: ${{ github.workspace }}/.mozbuild
        run: ./mizu bootstrap

      - name: Build Mizu
        env:
          MOZBUILD_STATE_PATH: ${{ github.workspace }}/.mozbuild
        run: ./mizu build

      - name: Select package version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=$INPUT_VERSION
          fi
          [[ $version =~ ^[0-9][0-9A-Za-z._+]*$ ]]
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build Arch Linux package
        env:
          MOZBUILD_STATE_PATH: ${{ github.workspace }}/.mozbuild
        run: |
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          ./mizu arch-package "${{ steps.version.outputs.value }}"

      - name: Create checksums
        run: |
          cd dist
          cp mizu-browser-*.pkg.tar.zst mizu-browser-x86_64.pkg.tar.zst
          sha256sum mizu-browser-*.pkg.tar.zst > SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mizu-linux-${{ steps.version.outputs.value }}
          path: |
            dist/*.pkg.tar.zst
            dist/SHA256SUMS

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.pkg.tar.zst dist/SHA256SUMS
          --verify-tag --generate-notes --title "Mizu ${{ steps.version.outputs.value }}"
